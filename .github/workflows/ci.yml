name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Бэкенд — типы, линт, тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tabys_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d tabys_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Остальное e2e заполняют сами (test/setup-env.ts).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/tabys_test?schema=public
      # Хранилище лимитов проверяется на настоящем Redis; без переменной
      # эти тесты пропускаются.
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Клиент Prisma в src/generated соответствует схеме
        run: npx prisma generate && git diff --exit-code -- src/generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: e2e (миграции применяются в globalSetup)
        run: npm run test:e2e
      - run: npm run build

  frontend:
    name: Фронтенд — типы, линт, сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Типы маршрутов (PageProps, LayoutProps) для tsc
        run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      # Бэкенда здесь нет намеренно: сборка обязана проходить без него
      # (см. «Сборка от бэкенда не зависит» в src/lib/api/public.ts).
      - name: Сборка без бэкенда
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          API_ORIGIN: https://example.com
          API_URL: http://127.0.0.1:9/api/v1

  docker:
    name: Docker-образы и compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: compose.yaml собирается из .env.example
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/; s/^JWT_ACCESS_SECRET=.*/JWT_ACCESS_SECRET=ci/; s/^JWT_REFRESH_SECRET=.*/JWT_REFRESH_SECRET=ci/' .env
          docker compose config -q
      - name: Сборка образов
        run: docker compose build
